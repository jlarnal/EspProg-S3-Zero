; PlatformIO build of the Espressif esp-usb-bridge firmware for the
; Waveshare ESP32-S3-Zero. Builds the existing ESP-IDF project as-is:
;   - src_dir = main  -> the IDF "main" component (uses main/CMakeLists.txt,
;     main/idf_component.yml pulls espressif/tinyusb)
;   - components/ at the project root are auto-discovered (serial_handler,
;     debug_probe, util; serial_handler/idf_component.yml pulls
;     espressif/esp-serial-flasher)
;   - framework-espidf bundled with the espressif32 platform is IDF 5.5.2
;
; Debug-probe interface is build-time exclusive (JTAG or SWD). The default
; env builds JTAG; add an SWD env once the JTAG build is confirmed working.

[platformio]
src_dir = main
default_envs = s3zero_jtag


[env]
platform = espressif32
board = waveshare_esp32_s3_zero
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:s3zero_jtag]
; pinout.md is compiled into the firmware via a generated source (see
; main/CMakeLists.txt -> pinout_md.gen.c) and served verbatim by the MSC drive.
; The wireless serial feature (components/wireless) needs a custom partition
; table with a LittleFS 'storage' partition for wifi.txt. PlatformIO selects the
; partition table via board_build.partitions (NOT sdkconfig CONFIG_PARTITION_*).
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.s3zero.defaults
